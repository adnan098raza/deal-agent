# Clothing, shoes and jewelry/accessories are for a man: women's and kids' items are filtered
# out (title keywords such as "Damen", "Kinder", "Women", the source category, and the LLM's
# audience judgement). Unisex items are kept. Cosmetics have no restriction.
gender:
  men_only_categories:
    - clothing
    - shoes
    - jewelry_accessories

